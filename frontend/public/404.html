<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NBKR Assist - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script
      // Converts path-based URL into hash-based URL
      var pathSegmentsToKeep = 1; // '/nbkr-assist'
      var l = window.location;
      var repoBase = '/' + l.pathname.split('/')[1];
      var routePath = l.pathname.slice(repoBase.length);
      var query = l.search ? l.search : '';
      var hash = l.hash ? l.hash : '';
      
      var target = repoBase + '/#' + (routePath ? routePath : '/') + query + hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading NBKR Assist...</p>
  </body>
</html>
